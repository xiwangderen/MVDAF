[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvdaf"
version = "0.1.0"
description = "Reference implementation of MVDAF for parotid gland tumor classification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jiajun Wu" },
  { name = "Song Ou" },
  { name = "Xirui Wang" },
  { name = "Yuan Dai" },
  { name = "Huiyong Zhu" },
  { name = "Zunlei Feng" },
  { name = "Dan Yu" },
  { name = "Jie Lei" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

